plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

// ponytail: Fabric-only 26.3 port; Forge/NeoForge and the CurseForge/Modrinth upload tasks were removed.
version = "${minecraft_version}-${mod_version}"
group = 'com.majruszsdifficulty'
base.archivesName = "${mod_archives_name}-fabric"

repositories {
    mavenLocal() // the trimmed Majrusz Library: `./gradlew publishToMavenLocal` in ~/Documents/GIT/MajruszLibrary
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "com.majruszlibrary:majrusz-library:${majruszlibrary_version}"
    include "com.majruszlibrary:majrusz-library:${majruszlibrary_version}" // jar-in-jar: players install one mod
}

processResources {
    inputs.properties project.properties.findAll { it.key.startsWith('mod_') || it.key.startsWith('fabric_') }
    filesMatching('fabric.mod.json') { expand project.properties }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
